name: Bug report
description: Something behaves incorrectly or crashes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please include enough detail to reproduce the
        problem without guessing. For security issues, use SECURITY.md instead.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Actual behaviour, including the exact command or Python snippet.
      placeholder: |
        Command: bbpe encode --model vocab.json --text "hello"
        Expected: [id, id, ...]
        Actual: panic: ...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: |
        Smallest corpus line, model file or code path that triggers the issue.
        Redact private data; a synthetic equivalent is fine.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Output of `git rev-parse HEAD`, or the release tag.
    validations:
      required: true

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI
        - Rust library
        - Python bindings
        - Build / packaging
        - Documentation
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Rust version, Python version, corpus size and vocabulary size.
      placeholder: |
        OS: Ubuntu 24.04
        Rust: 1.85.0
        Python: 3.12
        Corpus: 8.28 GB JSONL
        Vocab: 100256
    validations:
      required: false
