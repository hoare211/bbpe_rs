name: Feature request
description: Suggest a capability or an API change.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the project does not support today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: CLI flag, API shape, or configuration you would like to see.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or other tools that solve this.
    validations:
      required: false

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options:
        - CLI
        - Rust library
        - Python bindings
        - Documentation
        - Performance
    validations:
      required: true
